<!DOCTYPE html>
<html lang="en" style="background: #0a0a0c;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isthmic Pro | Sovereign Command</title>
    <style>
        body { 
            background: #0a0a0c; 
            margin: 0; 
            font-family: sans-serif; 
            color: white; 
            overflow-x: hidden; 
            overflow-y: auto !important;
        }
        #panic-ui { 
            display: none; position: fixed; inset: 0; z-index: 999999; 
            background: #000; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;
        }
        .btn-reset { 
            background: #d4af37; color: black; border: none; padding: 15px 40px; 
            border-radius: 12px; font-weight: 900; cursor: pointer; margin-top: 20px; text-transform: uppercase; letter-spacing: 0.1em;
            transition: all 0.3s ease;
        }
        .btn-reset:hover { background: #fff; transform: scale(1.05); }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.2.4",
    "react-dom": "https://esm.sh/react-dom@19.2.4",
    "react-dom/client": "https://esm.sh/react-dom@19.2.4/client",
    "recharts": "https://esm.sh/recharts@3.7.0",
    "three": "https://esm.sh/three@0.173.0",
    "@google/genai": "https://esm.sh/@google/genai@1.38.0",
    "path": "https://esm.sh/path@^0.12.7",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.3",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@tanstack/react-query": "https://esm.sh/@tanstack/react-query@^5.90.20",
    "vitest": "https://esm.sh/vitest@^4.0.18",
    "vitest/": "https://esm.sh/vitest@^4.0.18/",
    "url": "https://esm.sh/url@^0.11.4",
    "@playwright/test": "https://esm.sh/@playwright/test@^1.58.1",
    "@testing-library/jest-dom": "https://esm.sh/@testing-library/jest-dom@^6.9.1",
    "@sentry/react": "https://esm.sh/@sentry/react@^10.38.0"
  }
}
</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <div id="panic-ui">
        <i class="fas fa-microchip" style="color: #d4af37; font-size: 50px; margin-bottom: 20px; opacity: 0.5;"></i>
        <h1 style="font-size: 24px; font-weight: 900; letter-spacing: -0.05em; margin-bottom: 10px;">CORE_NEGOTIATION_FAILED</h1>
        <p style="color: #666; font-size: 11px; max-width: 350px; line-height: 1.6;">The Sovereign engine failed to mount within the stability window.</p>
        <button class="btn-reset" onclick="hardReboot()">Force Sovereign Reboot</button>
    </div>

    <div id="root"></div>

    <script>
        window.markAppAsMounted = () => {
            window.isIsthmicMounted = true;
            document.getElementById('panic-ui').style.display = 'none';
        };

        function hardReboot() {
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = window.location.origin + "/";
        }
    </script>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
