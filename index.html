<!DOCTYPE html>
<html lang="en" style="background: #0a0a0c;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isthmic Pro | Sovereign Command</title>
    <style>
        body { 
            background: #0a0a0c; 
            margin: 0; 
            font-family: sans-serif; 
            color: white; 
            overflow-x: hidden; 
            overflow-y: auto !important;
        }
        #panic-ui { 
            display: none; position: fixed; inset: 0; z-index: 999999; 
            background: #000; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;
        }
        .btn-reset { 
            background: #d4af37; color: black; border: none; padding: 15px 40px; 
            border-radius: 12px; font-weight: 900; cursor: pointer; margin-top: 20px; text-transform: uppercase; letter-spacing: 0.1em;
            transition: all 0.3s ease;
        }
        .btn-reset:hover { background: #fff; transform: scale(1.05); }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/src/index.css">
</head>
<body>
    <div id="panic-ui">
        <i class="fas fa-microchip" style="color: #d4af37; font-size: 50px; margin-bottom: 20px; opacity: 0.5;"></i>
        <h1 style="font-size: 24px; font-weight: 900; letter-spacing: -0.05em; margin-bottom: 10px;">CORE_NEGOTIATION_FAILED</h1>
        <p style="color: #666; font-size: 11px; max-width: 350px; line-height: 1.6;">The Sovereign engine failed to mount within the stability window.</p>
        <button class="btn-reset" onclick="hardReboot()">Force Sovereign Reboot</button>
    </div>

    <div id="root"></div>

    <script>
        window.isIsthmicMounted = false;
        window.markAppAsMounted = () => {
            window.isIsthmicMounted = true;
            document.getElementById('panic-ui').style.display = 'none';
            console.log('🎖️ [SYSTEM] Sovereign Engine Mounted Successfully.');
        };

        window.addEventListener('error', function(event) {
            const panicUi = document.getElementById('panic-ui');
            if (panicUi) {
                panicUi.style.display = 'flex';
                const errorMsg = document.createElement('p');
                errorMsg.style.color = '#ff4444';
                errorMsg.style.fontSize = '12px';
                errorMsg.style.marginTop = '10px';
                errorMsg.style.fontFamily = 'monospace';
                errorMsg.style.wordBreak = 'break-all';
                errorMsg.innerText = 'ERROR: ' + event.message + ' at ' + event.filename + ':' + event.lineno;
                panicUi.appendChild(errorMsg);
            }
        });

        window.addEventListener('unhandledrejection', function(event) {
            const panicUi = document.getElementById('panic-ui');
            if (panicUi) {
                panicUi.style.display = 'flex';
                const errorMsg = document.createElement('p');
                errorMsg.style.color = '#ff4444';
                errorMsg.style.fontSize = '12px';
                errorMsg.style.marginTop = '10px';
                errorMsg.style.fontFamily = 'monospace';
                errorMsg.style.wordBreak = 'break-all';
                errorMsg.innerText = 'PROMISE_ERROR: ' + (event.reason && event.reason.message ? event.reason.message : event.reason);
                panicUi.appendChild(errorMsg);
            }
        });

        function hardReboot() {
            localStorage.clear();
            sessionStorage.clear();
            // Force reload from server, bypassing cache
            window.location.reload(true);
        }

        // Boot Watchdog: If app doesn't mount in 10s, show panic UI
        setTimeout(() => {
            if (!window.isIsthmicMounted) {
                console.error('🚨 [CRITICAL] Sovereign Engine failed to mount within stability window.');
                document.getElementById('panic-ui').style.display = 'flex';
            }
        }, 10000);
    </script>
    <script type="module" src="/src/index.tsx"></script>
</body>
</html>
