<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Isthmic - Domainer Pro Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Updated Font Imports: Inter for Latin, IBM Plex Sans Arabic for UI, Cairo for Display -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./index.css">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              border: "hsl(var(--border))",
              background: "hsl(var(--background))",
              foreground: "hsl(var(--foreground))",
              primary: {
                DEFAULT: "hsl(var(--primary))",
                foreground: "hsl(var(--primary-foreground))",
              },
              accent: {
                DEFAULT: "hsl(var(--accent))",
              },
            },
            fontFamily: {
              // Priority given to IBM Plex for its professional/technical vibe
              sans: ['IBM Plex Sans Arabic', 'Inter', 'sans-serif'],
              display: ['Cairo', 'IBM Plex Sans Arabic', 'sans-serif'],
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out',
              'slide-up': 'slideUp 0.5s ease-out',
              'pulse-slow': 'pulse 6s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'orb-float': 'orbFloat 20s infinite alternate',
            },
            keyframes: {
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              slideUp: { '0%': { transform: 'translateY(20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
              orbFloat: {
                '0%': { transform: 'translate(0, 0) scale(1)' },
                '100%': { transform: 'translate(10%, 10%) scale(1.1)' },
              }
            }
          }
        }
      }
    </script>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
  }
}
</script>
</head>
<body class="bg-background text-foreground selection:bg-primary/30 antialiased tracking-tight">
    <div class="aurora-orb orb-1 animate-orb-float"></div>
    <div class="aurora-orb orb-2 animate-orb-float" style="animation-delay: -5s;"></div>
    <div class="aurora-orb orb-3 animate-orb-float" style="animation-delay: -10s;"></div>

    <div id="root"></div>

    <script type="module" src="./index.tsx"></script>
</body>
</html>
