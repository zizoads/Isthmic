<!-- ملف static/index.html -->
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Brand Intelligence</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #0f172a; color: #f8fafc; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 320px; background: #1e293b; padding: 20px; overflow-y: auto; border-right: 1px solid #334155; }
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
        h1, h2, h3 { margin-top: 0; color: #38bdf8; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: #94a3b8; }
        input, select, textarea { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 10px; }
        .checkbox-item { display: flex; align-items: center; gap: 5px; font-size: 0.8rem; }
        .checkbox-item input { width: auto; }
        button { background: #0284c7; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: 600; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        button:disabled { background: #475569; cursor: not-allowed; }
        pre { background: #0f172a; padding: 15px; border-radius: 8px; font-size: 0.85rem; border: 1px solid #334155; color: #cbd5e1; white-space: pre-wrap; word-break: break-all; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; margin-top: 10px; }
        .status-idle { background: #334155; color: #94a3b8; }
        .status-running { background: #0369a1; color: #e0f2fe; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    </style>
</head>
<body>
<div class="sidebar">
    <h3>إعدادات التحليل</h3>
    <div class="form-group">
        <label>المنصات المستهدفة</label>
        <div class="checkbox-group" id="platformsList">
            <!-- Will be populated by JS -->
        </div>
    </div>
    <hr style="border-color: #334155; margin: 20px 0;">
    <div class="form-group">
        <label>الكلمات المفتاحية (طول/تكرار)</label>
        <div style="display: flex; gap: 10px;">
            <input type="number" id="min_keyword_length" value="5" title="الحد الأدنى للطول">
            <input type="number" id="min_keyword_frequency" value="3" title="الحد الأدنى للتكرار">
        </div>
    </div>
    <div class="form-group">
        <label>أوزان المصادر (مقال/براءة/ناشئة)</label>
        <div style="display: flex; gap: 5px;">
            <input type="number" step="0.1" id="weight_articles" value="1.0">
            <input type="number" step="0.1" id="weight_patents" value="2.0">
            <input type="number" step="0.1" id="weight_startups" value="3.0">
        </div>
    </div>
    <div class="form-group">
        <label>نمط التسمية</label>
        <select id="brand_name_style">
            <option value="merged">Merged (TechCrunch)</option>
            <option value="acronym">Acronym (TC TechCrunch)</option>
            <option value="compound">Compound (Tech Crunch)</option>
        </select>
    </div>
    <div class="form-group">
        <label>حلقة التحسين</label>
        <div class="checkbox-item">
            <input type="checkbox" id="enable_loop" checked> <span>تفعيل التحسين التكراري</span>
        </div>
    </div>
    <div class="form-group">
        <label>عدد التكرارات / الهدف</label>
        <div style="display: flex; gap: 10px;">
            <input type="number" id="max_iterations" value="3">
            <input type="number" step="0.05" id="target_score" value="0.85">
        </div>
    </div>
    <button id="crawlBtn">بدء المهمة الاستخباراتية</button>
    <div id="statusBadge" class="status-badge status-idle">جاهز للعمل</div>
</div>

<div class="main-content">
    <h1>Smart Brand Intelligence Dashboard</h1>
    <div id="statusMsg"></div>
    
    <div class="grid">
        <div class="card">
            <h2>الترندات المكتشفة</h2>
            <div id="trends"></div>
        </div>
        <div class="card">
            <h2>فرص العلامات التجارية</h2>
            <div id="opportunities"></div>
        </div>
    </div>
</div>

<script>
    const platforms = [
        "TechCrunch", "The Verge", "Engadget", "TechRadar", "GeekWire", 
        "CNET", "Mashable", "Gizmodo", "Lifewire", "PatentsView", 
        "Crunchbase", "BetaList", "Product Hunt", "AngelList"
    ];

    const platformsContainer = document.getElementById('platformsList');
    platforms.forEach(p => {
        const div = document.createElement('div');
        div.className = 'checkbox-item';
        div.innerHTML = `<input type="checkbox" value="${p}" checked> <span>${p}</span>`;
        platformsContainer.appendChild(div);
    });

    async function fetchData(endpoint, elementId) {
        const container = document.getElementById(elementId);
        try {
            const response = await fetch(`/api/${endpoint}`);
            const data = await response.json();
            const pre = document.createElement('pre');
            pre.textContent = JSON.stringify(data, null, 2);
            container.innerHTML = '';
            container.appendChild(pre);
        } catch (err) {
            container.innerHTML = '';
            const p = document.createElement('p');
            p.style.color = '#ef4444';
            p.textContent = `خطأ: ${err.message}`;
            container.appendChild(p);
        }
    }

    document.getElementById('crawlBtn').addEventListener('click', async () => {
        const btn = document.getElementById('crawlBtn');
        const statusBadge = document.getElementById('statusBadge');
        const statusMsg = document.getElementById('statusMsg');
        const selectedPlatforms = Array.from(document.querySelectorAll('#platformsList input:checked')).map(i => i.value);
        
        const payload = {
            selected_platforms: selectedPlatforms,
            min_keyword_length: parseInt(document.getElementById('min_keyword_length').value),
            min_keyword_frequency: parseInt(document.getElementById('min_keyword_frequency').value),
            weight_articles: parseFloat(document.getElementById('weight_articles').value),
            weight_patents: parseFloat(document.getElementById('weight_patents').value),
            weight_startups: parseFloat(document.getElementById('weight_startups').value),
            brand_name_style: document.getElementById('brand_name_style').value,
            enable_loop: document.getElementById('enable_loop').checked,
            max_iterations: parseInt(document.getElementById('max_iterations').value),
            target_score: parseFloat(document.getElementById('target_score').value),
            max_brands: 5,
            limit_per_source: 10
        };

        btn.disabled = true;
        statusBadge.className = 'status-badge status-running';
        statusBadge.textContent = 'جاري التحليل...';
        
        try {
            const res = await fetch('/api/crawl', { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify(payload) 
            });
            const data = await res.json();
            statusMsg.innerHTML = '';
            const p = document.createElement('p');
            p.style.color = '#10b981';
            p.textContent = '✅ تم بدء المهمة بنجاح.';
            statusMsg.appendChild(p);
            
            // Poll for results
            let attempts = 0;
            const interval = setInterval(async () => {
                await fetchData('trends', 'trends');
                await fetchData('opportunities', 'opportunities');
                attempts++;
                if (attempts > 10) {
                    clearInterval(interval);
                    btn.disabled = false;
                    statusBadge.className = 'status-badge status-idle';
                    statusBadge.textContent = 'جاهز للعمل';
                }
            }, 5000);
        } catch (err) {
            statusMsg.innerHTML = '';
            const p = document.createElement('p');
            p.style.color = '#ef4444';
            p.textContent = `خطأ: ${err.message}`;
            statusMsg.appendChild(p);
            
            btn.disabled = false;
            statusBadge.className = 'status-badge status-idle';
            statusBadge.textContent = 'خطأ في الاتصال';
        }
    });

    fetchData('trends', 'trends');
    fetchData('opportunities', 'opportunities');
</script>
</body>
</html>
